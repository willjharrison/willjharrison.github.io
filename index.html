  <script>
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class DiscPairAnimation {
      constructor() {
        this.reset();
      }

      reset() {
        // Random circle center ensuring it stays reasonably on screen
        this.cx = Math.random() * (canvas.width - 300) + 150;
        this.cy = Math.random() * (canvas.height - 300) + 150;
        this.radius = Math.random() * 80 + 60; // Radius between 60 and 140px

        // Size of discs within the pair (same size per pair, 12 to 28px)
        this.discSize = Math.random() * 16 + 12;

        // Total target rotation: 360 to 1440 degrees converted to radians
        const totalDeg = Math.random() * (1440 - 360) + 360;
        this.targetDistance = (totalDeg * Math.PI) / 180;
        this.traveledDistance = 0;

        // Kinematics for acceleration and deceleration profile
        this.currentSpeed = 0;
        this.maxSpeed = Math.random() * 0.04 + 0.02; // Increased speed for visible rotation
        this.accelerationPhase = 0.25; 
        this.decelerationPhase = 0.75; 

        // Starting angles for the two discs (chasing each other with an offset)
        this.angle1 = Math.random() * Math.PI * 2;
        this.angle2 = this.angle1 - (Math.PI * 0.6); // Chase offset

        // Random starting hues and shift rates for circular color space
        this.hue1 = Math.random() * 360;
        this.hue2 = Math.random() * 360;
        this.hueSpeed1 = (Math.random() - 0.5) * 2;
        this.hueSpeed2 = (Math.random() - 0.5) * 2;

        // Fade state (0 = invisible, 1 = fully visible)
        this.opacity = 0;
        this.state = 'fadeIn'; 
      }

      update() {
        const progress = this.traveledDistance / this.targetDistance;

        // Velocity profile: acceleration -> cruise -> deceleration
        if (progress < this.accelerationPhase) {
          let p = progress / this.accelerationPhase;
          this.currentSpeed = this.maxSpeed * Math.sin(p * Math.PI / 2);
        } else if (progress > this.decelerationPhase) {
          let p = (progress - this.decelerationPhase) / (1 - this.decelerationPhase);
          this.currentSpeed = this.maxSpeed * Math.cos(p * Math.PI / 2);
        } else {
          this.currentSpeed = this.maxSpeed;
        }

        // Advance angles
        this.angle1 += this.currentSpeed;
        this.angle2 += this.currentSpeed;
        this.traveledDistance += this.currentSpeed;

        // Color shifting through circular colour space
        this.hue1 = (this.hue1 + this.hueSpeed1 + 360) % 360;
        this.hue2 = (this.hue2 + this.hueSpeed2 + 360) % 360;

        // Opacity handling (fade in / fade out)
        if (this.state === 'fadeIn') {
          this.opacity += 0.03;
          if (this.opacity >= 1) {
            this.opacity = 1;
            this.state = 'spinning';
          }
        } else if (this.state === 'spinning') {
          if (progress >= 1.0) {
            this.state = 'fadeOut';
          }
        } else if (this.state === 'fadeOut') {
          this.opacity -= 0.03;
          if (this.opacity <= 0) {
            this.opacity = 0;
            this.reset(); // Respawn at a new location with new parameters
          }
        }
      }

      draw() {
        if (this.opacity <= 0) return;

        // Calculate positions on imaginary circle
        const x1 = this.cx + Math.cos(this.angle1) * this.radius;
        const y1 = this.cy + Math.sin(this.angle1) * this.radius;
        const x2 = this.cx + Math.cos(this.angle2) * this.radius;
        const y2 = this.cy + Math.sin(this.angle2) * this.radius;

        ctx.save();
        ctx.globalAlpha = this.opacity;

        // Draw connecting subtle path trail between the two chasing discs
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.strokeStyle = `hsla(${(this.hue1 + this.hue2)/2}, 60%, 50%, 0.25)`;
        ctx.lineWidth = 2;
        ctx.stroke();

        // Disc 1
        ctx.beginPath();
        ctx.arc(x1, y1, this.discSize, 0, Math.PI * 2);
        ctx.fillStyle = `hsl(${this.hue1}, 70%, 55%)`;
        ctx.fill();

        // Disc 2
        ctx.beginPath();
        ctx.arc(x2, y2, this.discSize, 0, Math.PI * 2);
        ctx.fillStyle = `hsl(${this.hue2}, 70%, 55%)`;
        ctx.fill();

        ctx.restore();
      }
    }

    // Initialize background pairs
    const pairs = [new DiscPairAnimation(), new DiscPairAnimation(), new DiscPairAnimation()];

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      pairs.forEach(pair => {
        pair.update();
        pair.draw();
      });

      requestAnimationFrame(animate);
    }

    animate();
  </script>
